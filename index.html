<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demirkapı Çiftliği - Müşteri & Cari Yönetimi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #2c3e50; margin-bottom: 10px; }
        
        /* Dashboard */
        .dashboard { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .dash-card { background: #eef2f5; padding: 15px; border-radius: 8px; flex: 1; min-width: 200px; border-left: 5px solid #3498db; }
        .dash-card.warning { border-left-color: #e74c3c; background: #fdf2e9; }
        .dash-card small { color: #7f8c8d; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .dash-card h3 { font-size: 22px; margin-top: 5px; color: #2c3e50; }

        /* Formlar ve Girdiler */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #34495e; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        input:focus, select:focus { border-color: #3498db; outline: none; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button.btn-danger { background: #e74c3c; }
        button.btn-success { background: #2ecc71; }
        button.btn-secondary { background: #95a5a6; }
        button.btn-wa { background: #25D366; color: white; }

        /* Arama & Liste */
        .search-bar { margin-bottom: 15px; }
        .musteri-listesi { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .musteri-karti { background: #fff; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .musteri-karti:hover { border-color: #3498db; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .musteri-bilgi h4 { margin-bottom: 5px; color: #2c3e50; }
        .musteri-bilgi p { font-size: 12px; color: #7f8c8d; }
        .musteri-bakiye { text-align: right; font-weight: bold; font-size: 16px; }
        .bakiye-arti { color: #e74c3c; }
        .bakiye-eksi { color: #2ecc71; }

        /* Modallar */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        
        /* Tablo */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f8f9fa; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Demirkapı Çiftliği - Cari Takip</h2>
    <hr style="margin: 10px 0 20px 0; border: 0; border-top: 1px solid #eee;">

    <!-- Dashboard -->
    <div class="dashboard">
        <div class="dash-card">
            <small>Toplam Alacak</small>
            <h3 id="toplam-alacak">0.00 TL</h3>
        </div>
        <div class="dash-card warning">
            <small>Vadesi Gelen / Geçen</small>
            <h3 id="vadesi-gelen-toplam">0.00 TL</h3>
        </div>
    </div>

    <!-- Kontrol Butonları & Arama -->
    <div class="btn-group" style="margin-bottom: 15px;">
        <button onclick="musteriEkleModalAc()">+ Yeni Müşteri</button>
        <button class="btn-secondary" onclick="verileriDisaAktar()">Yedek İndir</button>
        <button class="btn-secondary" onclick="document.getElementById('yedek-input').click()">Yedek Yükle</button>
        <input type="file" id="yedek-input" class="hidden" onchange="verileriIceAktar(event)">
    </div>

    <input type="text" id="arama-input" class="search-bar" onkeyup="musteriAra()" placeholder="Müşteri adı veya telefon ara...">

    <!-- Müşteri Listesi -->
    <div id="musteri-listesi" class="musteri-listesi"></div>
</div>

<!-- Müşteri Ekle/Düzenle Modalı -->
<div id="musteri-modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-baslik">Yeni Müşteri Ekle</h3>
        <br>
        <div class="form-group">
            <label>Adı Soyadı</label>
            <input type="text" id="m-ad">
        </div>
        <div class="form-group">
            <label>Telefon (5XXXXXXXXX)</label>
            <input type="text" id="m-tel" placeholder="5321234567">
        </div>
        <div class="form-group">
            <label>Borç Limit (TL) - (0: Sınırsız)</label>
            <input type="number" id="m-limit" value="0">
        </div>
        <div class="btn-group">
            <button class="btn-success" onclick="musteriKaydet()">Kaydet</button>
            <button class="btn-secondary" onclick="modalKapat('musteri-modal')">İptal</button>
        </div>
    </div>
</div>

<!-- Müşteri Detay / İşlem Modalı -->
<div id="detay-modal" class="modal">
    <div class="modal-content">
        <h3 id="detay-musteri-adi">Müşteri Detayı</h3>
        <p id="detay-musteri-bakiye" style="font-weight: bold; margin: 5px 0 15px 0;"></p>

        <!-- İşlem Ekle Formu -->
        <div style="background: #f8f9fa; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
            <h4>Yeni İşlem Ekle</h4>
            <div class="form-group" style="margin-top: 8px;">
                <label>İşlem Tipi</label>
                <select id="i-tip">
                    <option value="borc">Satış / Borç Ekle (+)</option>
                    <option value="tahsulat">Tahsilat / Ödeme Al (-)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Açıklama</label>
                <input type="text" id="i-aciklama" placeholder="Örn: Silaj Satışı">
            </div>
            <div class="form-group">
                <label>Tutar (TL)</label>
                <input type="number" id="i-tutar" step="0.01">
            </div>
            <div class="form-group">
                <label>Vade Tarihi (Opsiyonel)</label>
                <input type="date" id="i-vade">
            </div>
            <button class="btn-success" onclick="islemEkle()">İşlemi Kaydet</button>
        </div>

        <!-- İşlem Geçmişi -->
        <h4>İşlem Geçmişi</h4>
        <div style="max-height: 200px; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Tarih</th>
                        <th>Açıklama</th>
                        <th>Vade</th>
                        <th>Tutar</th>
                    </tr>
                </thead>
                <tbody id="islem-gecmisi-body"></tbody>
            </table>
        </div>

        <div class="btn-group" style="margin-top: 15px;">
            <button class="btn-wa" onclick="whatsappFisGonder()">WhatsApp Fiş At</button>
            <button class="btn-secondary" onclick="fisYazdir()">Fiş Yazdır</button>
            <button class="btn-danger" onclick="musteriSilTetikle()">Müşteriyi Sil</button>
            <button class="btn-secondary" onclick="modalKapat('detay-modal')">Kapat</button>
        </div>
    </div>
</div>

<!-- PIN Onay Modalı -->
<div id="pin-modal" class="modal">
    <div class="modal-content" style="text-align: center; max-width: 300px;">
        <h3>Güvenlik PIN'i</h3>
        <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Lütfen işlemi onaylamak için PIN girin.</p>
        <input type="password" id="pin-input" maxlength="4" style="font-size: 24px; text-align: center; width: 120px; margin: 0 auto 15px auto;">
        <div class="btn-group">
            <button onclick="pinKontrolEt()">Onayla</button>
            <button class="btn-secondary" onclick="modalKapat('pin-modal')">İptal</button>
        </div>
    </div>
</div>

<script>
    // --- VERİTABANI YAPISI ---
    const SABIT_PIN = "1234"; // Güvenlik PIN kodu
    let veritabani = {
        musteriler: []
    };
    let aktifMusteriId = null;
    let pinCallback = null;

    // --- BAŞLANGIÇ ---
    window.onload = function() {
        verileriYukle();
        otomatikYedekAl();
        arayuzGuncelle();
    };

    function kaydetVeri() {
        localStorage.setItem('demirkapi_vdb', JSON.stringify(veritabani));
        arayuzGuncelle();
    }

    function verileriYukle() {
        let kayit = localStorage.getItem('demirkapi_vdb');
        if (kayit) {
            try { veritabani = JSON.parse(kayit); } catch(e) { veritabani = { musteriler: [] }; }
        }
    }

    // --- 1. OTOMATİK YEDEKLEME ---
    function otomatikYedekAl() {
        const sonYedek = localStorage.getItem('son_yedek_tarihi');
        const bugun = new Date().toISOString().slice(0, 10);
        if (sonYedek !== bugun) {
            localStorage.setItem('yedek_snapshot_' + bugun, JSON.stringify(veritabani));
            localStorage.setItem('son_yedek_tarihi', bugun);
        }
    }

    // --- 4. ARAMA VE DASHBOARD ---
    function arayuzGuncelle() {
        let listEl = document.getElementById('musteri-listesi');
        listEl.innerHTML = '';

        let toplamAlacak = 0;
        let vadesiGelen = 0;
        let bugun = new Date().toISOString().slice(0, 10);

        veritabani.musteriler.forEach(m => {
            toplamAlacak += m.bakiye;

            m.islemler.forEach(i => {
                if (i.vade && i.vade <= bugun && i.tip === 'borc') {
                    vadesiGelen += i.tutar;
                }
            });

            let kart = document.createElement('div');
            kart.className = 'musteri-karti';
            kart.onclick = () => detayModalAc(m.id);
            kart.innerHTML = `
                <div class="musteri-bilgi">
                    <h4>${m.ad}</h4>
                    <p>Tel: ${m.tel || '-'} ${m.limit > 0 ? '| Limit: ' + m.limit + ' TL' : ''}</p>
                </div>
                <div class="musteri-bakiye ${m.bakiye > 0 ? 'bakiye-arti' : 'bakiye-eksi'}">
                    ${m.bakiye.toFixed(2)} TL
                </div>
            `;
            listEl.appendChild(kart);
        });

        document.getElementById('toplam-alacak').innerText = toplamAlacak.toFixed(2) + " TL";
        document.getElementById('vadesi-gelen-toplam').innerText = vadesiGelen.toFixed(2) + " TL";
        musteriAra();
    }

    function musteriAra() {
        let q = document.getElementById('arama-input').value.toLowerCase();
        let kartlar = document.querySelectorAll('.musteri-karti');
        kartlar.forEach(k => {
            let text = k.innerText.toLowerCase();
            k.style.display = text.includes(q) ? 'flex' : 'none';
        });
    }

    // --- MÜŞTERİ YÖNETİMİ ---
    function musteriEkleModalAc() {
        document.getElementById('m-ad').value = '';
        document.getElementById('m-tel').value = '';
        document.getElementById('m-limit').value = '0';
        document.getElementById('musteri-modal').style.display = 'flex';
    }

    function musteriKaydet() {
        let ad = document.getElementById('m-ad').value.trim();
        let tel = document.getElementById('m-tel').value.trim();
        let limit = parseFloat(document.getElementById('m-limit').value) || 0;

        if (!ad) { alert('Lütfen müşteri adı girin.'); return; }

        veritabani.musteriler.push({
            id: Date.now(),
            ad: ad,
            tel: tel,
            limit: limit,
            bakiye: 0,
            islemler: []
        });

        kaydetVeri();
        modalKapat('musteri-modal');
    }

    // --- 3. İŞLEM & BORÇ LİMİTİ / VADE ---
    function detayModalAc(id) {
        aktifMusteriId = id;
        let m = veritabani.musteriler.find(x => x.id === id);
        if (!m) return;

        document.getElementById('detay-musteri-adi').innerText = m.ad;
        document.getElementById('detay-musteri-bakiye').innerText = "Bakiye: " + m.bakiye.toFixed(2) + " TL";
        
        let tbody = document.getElementById('islem-gecmisi-body');
        tbody.innerHTML = '';
        
        m.islemler.slice().reverse().forEach(i => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i.tarih}</td>
                <td>${i.aciklama}</td>
                <td>${i.vade || '-'}</td>
                <td style="color:${i.tip === 'borc' ? 'red' : 'green'}; font-weight:bold;">
                    ${i.tip === 'borc' ? '+' : '-'}${i.tutar.toFixed(2)} TL
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('detay-modal').style.display = 'flex';
    }

    function islemEkle() {
        let m = veritabani.musteriler.find(x => x.id === aktifMusteriId);
        if (!m) return;

        let tip = document.getElementById('i-tip').value;
        let aciklama = document.getElementById('i-aciklama').value.trim() || (tip === 'borc' ? 'Borç Kaydı' : 'Tahsilat');
        let tutar = parseFloat(document.getElementById('i-tutar').value);
        let vade = document.getElementById('i-vade').value;

        if (!tutar || tutar <= 0) { alert('Geçerli bir tutar girin.'); return; }

        // Limit Kontrolü
        if (tip === 'borc' && m.limit > 0 && (m.bakiye + tutar) > m.limit) {
            if (!confirm(`Uyarı: Bu işlem müşteri limitini (${m.limit} TL) aşıyor! Devam edilsin mi?`)) {
                return;
            }
        }

        if (tip === 'borc') {
            m.bakiye += tutar;
        } else {
            m.bakiye -= tutar;
        }

        m.islemler.push({
            tarih: new Date().toISOString().slice(0, 10),
            tip: tip,
            aciklama: aciklama,
            tutar: tutar,
            vade: vade || null
        });

        kaydetVeri();
        detayModalAc(aktifMusteriId);

        document.getElementById('i-aciklama').value = '';
        document.getElementById('i-tutar').value = '';
        document.getElementById('i-vade').value = '';
    }

    // --- 2. WHATSAPP & FİŞ YAZDIRMA ---
    function whatsappFisGonder() {
        let m = veritabani.musteriler.find(x => x.id === aktifMusteriId);
        if (!m || !m.tel) { alert('Müşteriye ait telefon numarası bulunamadı.'); return; }

        let sonIslem = m.islemler[m.islemler.length - 1];
        let detayMetni = sonIslem ? `${sonIslem.aciklama} (${sonIslem.tutar} TL)` : 'İşlem yok';
        
        let msj = `Sayın ${m.ad},\n\nDemirkapı Çiftliği Hesabınız:\nSon İşlem: ${detayMetni}\nGüncel Güncel Bakiyeniz: ${m.bakiye.toFixed(2)} TL'dir.`;
        let url = `https://wa.me/90${m.tel.replace(/\D/g,'')}?text=${encodeURIComponent(msj)}`;
        window.open(url, '_blank');
    }

    function fisYazdir() {
        let m = veritabani.musteriler.find(x => x.id === aktifMusteriId);
        if (!m) return;

        let pwin = window.open('', '_blank');
        let icerik = `
            <div style="text-align:center; margin-bottom:10px;">
                <h2>DEMİRKAPI ÇİFTLİĞİ</h2>
                <p>Müşteri Fişi</p>
            </div>
            <hr>
            <p><strong>Müşteri:</strong> ${m.ad}</p>
            <p><strong>Tarih:</strong> ${new Date().toLocaleDateString('tr-TR')}</p>
            <hr>
            <table style="width:100%; border-collapse:collapse; margin:10px 0;">
                <tr><th style="text-align:left;">Açıklama</th><th style="text-align:right;">Tutar</th></tr>
                ${m.islemler.slice(-5).map(i => `
                    <tr>
                        <td>${i.aciklama} (${i.tarih})</td>
                        <td style="text-align:right;">${i.tip === 'borc' ? '+' : '-'}${i.tutar.toFixed(2)} TL</td>
                    </tr>
                `).join('')}
            </table>
            <hr>
            <h3 style="text-align:right; margin-top:10px;">Toplam Bakiye: ${m.bakiye.toFixed(2)} TL</h3>
        `;

        pwin.document.write(`
            <html>
            <head><title>Fiş - ${m.ad}</title></head>
            <body onload="window.print(); window.close();" style="font-family:monospace; padding:10px; width:280px;">
                ${icerik}
            </body>
            </html>
        `);
        pwin.document.close();
    }

    // --- 5. PIN VE SİLME GÜVENLİĞİ ---
    function pinIslemOnayi(callback) {
        pinCallback = callback;
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-modal').style.display = 'flex';
    }

    function pinKontrolEt() {
        let girilen = document.getElementById('pin-input').value;
        if (girilen === SABIT_PIN) {
            modalKapat('pin-modal');
            if (pinCallback) pinCallback();
        } else {
            alert('Hatalı PIN!');
        }
    }

    function musteriSilTetikle() {
        pinIslemOnayi(function() {
            veritabani.musteriler = veritabani.musteriler.filter(x => x.id !== aktifMusteriId);
            kaydetVeri();
            modalKapat('detay-modal');
            alert('Müşteri başarıyla silindi.');
        });
    }

    // --- YEDEK YÖNETİMİ ---
    function verileriDisaAktar() {
        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(veritabani, null, 2));
        let dl = document.createElement('a');
        let tarih = new Date().toISOString().slice(0, 10);
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", `demirkapi_yedek_${tarih}.json`);
        document.body.appendChild(dl);
        dl.click();
        dl.remove();
    }

    function verileriIceAktar(e) {
        let file = e.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(evt) {
            try {
                let data = JSON.parse(evt.target.result);
                pinIslemOnayi(function() {
                    veritabani = data;
                    kaydetVeri();
                    alert('Yedek başarıyla yüklendi!');
                });
            } catch (err) {
                alert('Geçersiz dosya formatı!');
            }
        };
        reader.readAsText(file);
    }

    function modalKapat(id) {
        document.getElementById(id).style.display = 'none';
    }
</script>
</body>
</html>
